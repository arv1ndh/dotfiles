# ============================================================================
# tmux configuration
# ============================================================================

# ── Catppuccin Mocha Palette ──────────────────────────────────────────────────

# @rosewater: #f5e0dc  @flamingo: #f2cdcd  @pink: #f5c2e7  @mauve: #cba6f7
# @red: #f38ba8  @maroon: #eba0ac  @peach: #fab387  @yellow: #f9e2af
# @green: #a6e3a1  @teal: #94e2d5  @sky: #89dceb  @sapphire: #74c7ec
# @blue: #89b4fa  @lavender: #b4befe
# @text: #cdd6f4  @subtext1: #bac2de  @subtext0: #a6adc8
# @overlay2: #9399b2  @overlay1: #7f849c  @overlay0: #6c7086
# @surface2: #585b70  @surface1: #45475a  @surface0: #313244
# @base: #1e1e2e  @mantle: #181825  @crust: #11111b

# ── Clipboard (OSC 52 passthrough for opencode etc.) ───────────────────────────

set -g allow-passthrough on
set -g set-clipboard on

# ── Core ──────────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g mouse on
set -g focus-events on
setw -g monitor-activity on
set -g visual-activity off
setw -g monitor-silence 0
set -g set-titles on
set -g set-titles-string '#H:#S.#I.#P #W #T'
setw -g aggressive-resize on

# ── Prefix ────────────────────────────────────────────────────────────────────

unbind C-b
set -g prefix `
bind-key ` send-prefix
bind r source-file ~/.tmux.conf \; display-message "  Config reloaded"

# ── Popups (tmux 3.2+) ────────────────────────────────────────────────────────

bind p display-popup -E -w 40% -h 60% "htop"
bind g display-popup -E -w 60% -h 80% "lazygit"
bind F display-popup -E -w 50% "find . -type f | fzf"

# ── Splits ────────────────────────────────────────────────────────────────────

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"

# ── Pane navigation ───────────────────────────────────────────────────────────

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Window swapping ───────────────────────────────────────────────────────────

bind -n C-S-Left  swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

# ── Pane borders ──────────────────────────────────────────────────────────────

set -g pane-border-lines single
set -g pane-border-style        "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# ── Status bar ────────────────────────────────────────────────────────────────

set -g status-position   bottom
set -g status-interval   5
set -g status-justify    left
set -g status-style      "fg=#a6adc8,bg=#181825"
set -g status-left-length  50
set -g status-right-length 90

# Left: [ 󰣇 session ][ 󰌽 user ]
set -g status-left \
"#[fg=#1e1e2e,bg=#89b4fa,bold] 󰣇 #S #[fg=#89b4fa,bg=#45475a]#[fg=#cdd6f4,bg=#45475a] 󰌽 #(whoami) #[fg=#45475a,bg=#181825]"

# Right: [  git ][ 󰃰 date ][ 󰥔 time ]
set -g status-right \
"#[fg=#45475a,bg=#181825]#[fg=#a6e3a1,bg=#45475a]  #(git -C #{pane_current_path} branch --show-current 2>/dev/null || echo '') #[fg=#313244,bg=#45475a]#[fg=#f9e2af,bg=#313244] 󰃰 %Y-%m-%d #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] 󰥔 %H:%M "

# Window list
setw -g window-status-separator       ""
setw -g window-status-format \
"#[fg=#313244,bg=#181825]#[fg=#a6adc8,bg=#313244] #I  #W #[fg=#313244,bg=#181825]"
setw -g window-status-current-format \
"#[fg=#45475a,bg=#181825]#[fg=#1e1e2e,bg=#89b4fa,bold] #I  #W #[fg=#89b4fa,bg=#181825]"
setw -g window-status-activity-style  "fg=#cba6f7,bg=#313244,bold"

# Messages and copy mode
set -g message-style "fg=#1e1e2e,bg=#89b4fa,bold"
setw -g mode-style   "fg=#1e1e2e,bg=#cba6f7,bold"
